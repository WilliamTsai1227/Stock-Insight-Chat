<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- 分享頁：不被搜尋引擎收錄；連到外部網站時不帶上含 token 的網址 -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#F5F6F4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#182024" media="(prefers-color-scheme: dark)">
    <title>分享的對話 | Insight</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/share-page.css">
    <script>
        // 先套主題再畫面，避免閃一下：沿用主站的偏好，沒有就跟系統
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('insightUiTheme'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#conversation">跳到對話內容</a>

    <header class="share-top">
        <a class="share-brand" href="/" translate="no">Insight</a>
        <button type="button" class="share-theme" id="share-theme" aria-label="切換淺色／深色模式">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
        </button>
    </header>

    <main class="share-page">
        <div class="share-head">
            <h1 id="share-title" class="share-title">載入對話中…</h1>
            <p id="share-sub" class="share-sub"></p>
        </div>

        <div id="conversation" class="share-thread" tabindex="-1" aria-live="polite"></div>

        <footer id="share-foot" class="share-foot" hidden>
            <p class="share-disclaimer">這段對話由 AI 根據當時能取得的資料產生，僅供參考，不構成投資建議。投資前請自行查證並評估風險。</p>
            <a class="share-cta" href="/login">用 Insight 問你自己的問題</a>
        </footer>
    </main>

    <script src="/js/api-config.js"></script>
    <script src="/js/share-page.js" defer></script>
</body>
</html>
