name: Build Windows desktop
on:
  workflow_dispatch:
    inputs:
      frontend_origin:
        description: Public frontend origin (must match cloud CORS and FRONTEND_URL)
        default: https://insight-chat.xyz
        required: true
      api_base:
        description: Public cloud API URL
        default: https://api.insight-chat.xyz/api
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run dist:win
        env:
          DESKTOP_FRONTEND_ORIGIN: ${{ inputs.frontend_origin }}
          DESKTOP_API_BASE: ${{ inputs.api_base }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: Stock-Insight-Windows-x64
          path: app/desktop/dist/*Setup.exe
          if-no-files-found: error
