services:
  # 1. 後端 (FastAPI + Agent)
  backend:
    build:
      context: .. 
      dockerfile: deploy/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env # 這邊會自動讀取你 .env 內的 MONGODB_URL 與 OPENAI_API_KEY
    environment:
      - QDRANT_HOST=qdrant
      # DATABASE_URL 由 ../.env 注入（本機 db 或 AWS RDS）
    depends_on:
      - qdrant

  # 2. 資料庫 (PostgreSQL 16) — 已改用 AWS RDS 時可整段註解，不再啟動本機 db
  # db:
  #   image: postgres:16-alpine
  #   restart: always
  #   environment:
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=password123
  #     - POSTGRES_DB=Insight
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
  #     - ../app/backend/database/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro

  # 3. 向量資料庫 (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    mem_limit: 3g
    deploy:
      resources:
        limits:
          memory: 3G
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  # 4. 前端 (Nginx + Frontend)
  frontend:
    build:
      context: .. 
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  # db_data:   # 本機 db 停用後可一併註解；舊 volume 仍佔磁碟，需手動 docker volume rm
  qdrant_storage:
