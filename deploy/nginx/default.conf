server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # 禁止舊路徑：/html/*
  location ^~ /html/ {
    return 404;
  }

  # Service Worker 不能被快取：否則使用者會一直卡在舊版 sw.js，
  # 前端更新要等快取過期才會生效。scope 是 /，檔案也必須放在站台根目錄。
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
  }

  # manifest 改動（名稱／圖示／display）要能立刻反映到安裝流程
  location = /manifest.json {
    add_header Cache-Control "no-cache" always;
    expires -1;
  }

  # $uri.html：前端一律導向無副檔名路徑（index.html 的 location.replace('/login')），
  # 本機 dev 也要能解析 /login → login.html，才和正式站（S3 + Cloudflare）行為一致。
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
